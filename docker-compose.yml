# Demo: `cp .env.example .env && docker compose up --build`, then open http://localhost:${WEB_PORT:-3000}
# Demo profiles: http://localhost:${WEB_PORT:-3000}/ada and /grace  (login ada@example.com / analytical-engine)
# Variables come from .env (see .env.example). SESSION_SECRET has no default on purpose: a known
# signing key would let anyone forge a login cookie the day the stack is reachable from outside.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: julinks
      POSTGRES_PASSWORD: julinks
      POSTGRES_DB: julinks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U julinks -d julinks"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Object storage for avatars, link pictures and theme backgrounds, behind the S3 API
  # (SeaweedFS, single node: master + volume + filer + S3 gateway on 8333). The app creates
  # the bucket on first use. Swap this for S3/R2 by changing the S3_* variables. No credentials
  # are enforced here and the port is not published; pass `-s3.config` with identities for real use.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -dir=/data -volume.max=10 -master.volumeSizeLimitMB=256
    restart: unless-stopped
    # SeaweedFS logs a lock-ring heartbeat every 30 s; keep it out of `docker compose up`
    # (still available with `docker compose logs s3`).
    attach: false
    volumes:
      - s3data:/data
    healthcheck:
      # 127.0.0.1, not localhost: SeaweedFS listens on IPv4 only, and where the container has
      # IPv6 enabled busybox wget resolves localhost to ::1 first and gives up.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Runs the migrations and the demo seed once, then exits; web waits for it. On a fresh database it
  # also prints the setup code for ${APP_URL}/setup (again with `docker compose logs migrate`).
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://julinks:julinks@db:5432/julinks
      APP_URL: ${APP_URL:-http://localhost:${WEB_PORT:-3000}}
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: julinks
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-julinks}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-julinks-secret}
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy

  web:
    build:
      context: .
      target: runner
    # db, s3 and web come back with the Docker daemon (a reboot, a `docker compose up -d` left
    # running); `docker compose down` or `stop` still stops them. migrate is one-shot by design.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://julinks:julinks@db:5432/julinks
      SESSION_SECRET: "${SESSION_SECRET:?set it in .env, see .env.example; a public site uses the output of openssl rand -base64 48}"
      APP_URL: ${APP_URL:-http://localhost:${WEB_PORT:-3000}}
      # Deployment switches, see .env.example: demo logins on by default (a laptop), off for a public site.
      ALLOW_DEMO_LOGIN: ${ALLOW_DEMO_LOGIN:-1}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: julinks
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-julinks}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-julinks-secret}
    ports:
      # Bound to the loopback address: a reverse proxy or tunnel on the same machine reaches it, the
      # LAN does not. WEB_BIND=0.0.0.0 publishes it to every interface.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  s3data:
