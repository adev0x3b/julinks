# Keeps the lockfile on patched releases: Next.js, React and sharp ship security fixes as
# patch versions, and the Docker image installs exactly what the lockfile says.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Toolchain majors (TypeScript, ESLint, Node types) are deliberate upgrades, not patches.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for the framework trio so a security release lands in one go.
      next:
        patterns: ["next", "react", "react-dom", "sharp", "eslint-config-next", "@next/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new Node major is a decision (CI and the runner move with it), patch tags come with every build.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
