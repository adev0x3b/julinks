name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  SESSION_SECRET: ci-session-secret-that-is-long-enough-123456
  S3_ACCESS_KEY_ID: julinks
  S3_SECRET_ACCESS_KEY: julinks-secret

jobs:
  checks:
    name: Lint, types, unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run --project unit --project component

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: julinks
          POSTGRES_PASSWORD: julinks
          POSTGRES_DB: julinks_test
        # A random free host port: the runner's machine may already use 5432 (or anything else).
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U julinks -d julinks_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # SeaweedFS as a plain container rather than a `services:` entry: service containers cannot
      # set a command, and the image needs `server -s3`. Random host port, cleaned up below.
      - name: Start SeaweedFS
        run: |
          name="julinks-s3-${{ github.run_id }}-${{ github.job }}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker run -d --name "$name" -p 127.0.0.1::8333 chrislusf/seaweedfs:4.48 server -s3 -dir=/data
          port=$(docker port "$name" 8333/tcp | head -1 | sed 's/.*://')
          for i in $(seq 1 30); do
            curl -s -o /dev/null "http://127.0.0.1:$port/" && break
            sleep 2
          done
          echo "S3_NAME=$name" >> "$GITHUB_ENV"
          echo "S3_TEST_ENDPOINT=http://127.0.0.1:$port" >> "$GITHUB_ENV"
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://julinks:julinks@localhost:${{ job.services.postgres.ports['5432'] }}/julinks_test
          TEST_S3_ENDPOINT: ${{ env.S3_TEST_ENDPOINT }}
      - name: Stop SeaweedFS
        if: always()
        run: docker rm -f "$S3_NAME" >/dev/null 2>&1 || true

  e2e:
    name: End-to-end (Playwright, production build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: julinks
          POSTGRES_PASSWORD: julinks
          POSTGRES_DB: julinks_e2e
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U julinks -d julinks_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      E2E_PORT: "3100"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Production build
        run: npm run build
        env:
          # The `job` context (service ports) is only available at step level, not in job env.
          DATABASE_URL: postgresql://julinks:julinks@localhost:${{ job.services.postgres.ports['5432'] }}/julinks_e2e
      # SeaweedFS as a plain container rather than a `services:` entry: service containers cannot
      # set a command, and the image needs `server -s3`. Random host port, cleaned up below.
      - name: Start SeaweedFS
        run: |
          name="julinks-s3-${{ github.run_id }}-${{ github.job }}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker run -d --name "$name" -p 127.0.0.1::8333 chrislusf/seaweedfs:4.48 server -s3 -dir=/data
          port=$(docker port "$name" 8333/tcp | head -1 | sed 's/.*://')
          for i in $(seq 1 30); do
            curl -s -o /dev/null "http://127.0.0.1:$port/" && break
            sleep 2
          done
          echo "S3_NAME=$name" >> "$GITHUB_ENV"
          echo "S3_TEST_ENDPOINT=http://127.0.0.1:$port" >> "$GITHUB_ENV"
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgresql://julinks:julinks@localhost:${{ job.services.postgres.ports['5432'] }}/julinks_e2e
          E2E_S3_ENDPOINT: ${{ env.S3_TEST_ENDPOINT }}
      - name: Stop SeaweedFS
        if: always()
        run: docker rm -f "$S3_NAME" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [checks, integration, e2e]
    env:
      # Own project name and a high port so the stack never collides with whatever else runs on the host.
      COMPOSE_PROJECT_NAME: julinks-ci
      WEB_PORT: "13000"
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up -d --build --quiet-pull
      - name: Wait for the app to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${WEB_PORT}/api/health" | grep -q '"ok"'; then exit 0; fi
            sleep 3
          done
          docker compose logs; exit 1
      - name: Nothing is served before setup, and the code the migrate step printed creates the admin
        run: |
          curl -fsS "http://127.0.0.1:${WEB_PORT}/ada" | grep -q "/setup"
          code=$(docker compose logs --no-log-prefix migrate | grep -oE '[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}' | tail -1)
          echo "setup code: ${code}"; test -n "$code"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            --data-urlencode "code=${code}" --data-urlencode "username=smoke" --data-urlencode "email=smoke@example.com" \
            --data-urlencode "password=smoke-test-password" --data-urlencode "confirmPassword=smoke-test-password" \
            "http://127.0.0.1:${WEB_PORT}/setup/submit")
          echo "setup status: $status"; test "$status" = "303"
          # A second code is refused now: the script says so and the page is closed.
          docker compose run --rm --no-deps migrate npm run setup-code | grep -q "already set up"
          curl -fsS "http://127.0.0.1:${WEB_PORT}/setup" | grep -q "already set up"
      - name: Demo profile is served from the seeded database, with its avatar from object storage
        run: |
          html=$(curl -fsS "http://127.0.0.1:${WEB_PORT}/ada")
          echo "$html" | grep -q "Ada Lovelace"
          avatar=$(echo "$html" | grep -oE '/img/avatars/[A-Za-z0-9/._-]+' | head -1)
          echo "avatar: $avatar"; test -n "$avatar"
          curl -fsS -o /dev/null -w '%{content_type}\n' "http://127.0.0.1:${WEB_PORT}${avatar}" | grep -q "image/webp"
      - name: Theme gallery lists the seeded themes
        run: curl -fsS "http://127.0.0.1:${WEB_PORT}/themes" | grep -q "Poetical Science"
      - name: A link click redirects and is recorded
        run: |
          id=$(curl -fsS "http://127.0.0.1:${WEB_PORT}/ada" | grep -oE 'data-link-id="[^"]+"' | head -1 | cut -d'"' -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${WEB_PORT}/l/${id}")
          echo "redirect status: $code"; test "$code" = "302"
          sleep 2
          docker compose exec -T db psql -U julinks -d julinks -Atc "select count(*) from clicks where \"linkId\" = '${id}'" | grep -vq '^0$'
      - name: Dashboard requires a session
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${WEB_PORT}/dashboard")
          echo "dashboard status: $code"; test "$code" = "307"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
